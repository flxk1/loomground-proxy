[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-proxy"
description = "Does this measurement still stand for what it claims? Declared substitutions checked against two readings. Gamed, unchecked, misleading, tracking. Substitutions chain, and a chain must ground out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# One narrow problem, one dependency — solver, whose own two language packs
# come with it. This package sits *above* the reasoning
# kernel: it uses the shared verdict, the OPEN-dominant fold and the injected
# ports, and reaches into no solver internals. It is imported by hosts, never by
# solver, versum or governance.
# Consumed from solver: cross_subsumption.Verdict, issue_aggregation.{IssueAggregate,aggregate_issues}
#   Every symbol above ships in 0.4.x, but the floor is 0.5: 0.5.0 is the release
#   in which solver no longer carries this package's module. Against 0.4.x a host
#   would install two implementations of the same thing — the extracted package
#   and the solver module it was extracted from. Keep the floor at 0.5.
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-proxy"
Repository = "https://github.com/flxk1/loomground-proxy"
Issues = "https://github.com/flxk1/loomground-proxy/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_proxy._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_proxy*"]

[tool.setuptools.package-data]
loomground_proxy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
